[package]
name = "op-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
op-engine = { path = "../op-engine" }
op-gpu = { path = "../op-gpu" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "WorkerGlobalScope", "Performance", "console"] }
wgpu.workspace = true
